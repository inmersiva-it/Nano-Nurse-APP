<div class="app-shell">
  <header class="navbar card">
    <div class="brand">
      <span class="brand-name">NanoDoc Clinical System</span>
      <span class="brand-subtitle">Plataforma profesional de enfermería nanotecnológica</span>
    </div>
    <nav class="nav-links">
      <button class="nav-button" [class.active]="activeView() === 'dashboard'" (click)="setView('dashboard')">Dashboard</button>
      <button class="nav-button" [class.active]="activeView() === 'patients'" (click)="setView('patients')">Pacientes</button>
      <button class="nav-button" [class.active]="activeView() === 'simulation'" (click)="setView('simulation')">Simulación</button>
    </nav>
  </header>

  <main class="app-main">
    <app-dashboard *ngIf="activeView() === 'dashboard'"></app-dashboard>
    <app-patient-list
      *ngIf="activeView() === 'patients'"
      [patients]="patients"
      (selectPatient)="selectPatient($event)"
    ></app-patient-list>
    <app-simulation-room
      *ngIf="activeView() === 'simulation'"
      [patient]="selectedPatient()"
      [state]="simulationState()"
      [progress]="progress()"
      (inject)="injectNanobots()"
    ></app-simulation-room>
  </main>
</div>
